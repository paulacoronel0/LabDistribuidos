

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tateti</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  /*CSS*/
  :root {
    --bg:       #0f0f13;
    --surface:  #1a1a22;
    --border:   #2e2e3e;
    --x-color:  #e8523a; /*Rojo para X*/
    --o-color:  #4a9eff; /*Azul para O*/
    --text:     #f0eeea;
    --muted:    #7a788a;
    --cell-bg:  #16161f;
    --cell-hover: #1e1e2a;
    --win-line: #ffd166; /*Amarillo para la linea ganadora*/
    --radius:   12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
  }

  h1 {
    font-family: 'Space Mono', monospace;
    font-size: clamp(2rem, 6vw, 3.2rem);
    letter-spacing: -1px;
    color: var(--text);
  }
  h1 span.x { color: var(--x-color); }
  h1 span.o { color: var(--o-color); }

  /* Status bar */
  #status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 48px;
    min-width: 300px;
    justify-content: center;
  }

  #status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
    flex-shrink: 0;
  }
  #status-dot.x   { background: var(--x-color); }
  #status-dot.o   { background: var(--o-color); }
  #status-dot.win { background: var(--win-line); }

  #status-text {
    font-size: 1rem;
    color: var(--muted);
    transition: color 0.3s;
    font-weight: 500;
  }
  #status-text.active { color: var(--text); }

  /* Symbol badge */
  #my-symbol {
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    color: var(--muted);
    display: none;
  }
  #my-symbol.x { border-color: var(--x-color); color: var(--x-color); }
  #my-symbol.o { border-color: var(--o-color); color: var(--o-color); }

  /* Board */
  #board-wrap {
    position: relative;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: var(--border);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 6px;
  }

  .cell {
    width: clamp(90px, 22vw, 120px);
    height: clamp(90px, 22vw, 120px);
    background: var(--cell-bg);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    user-select: none;
    position: relative;
    overflow: hidden;
  }
  .cell:hover:not(.taken):not(.disabled) {
    background: var(--cell-hover);
    transform: scale(1.03);
  }
  .cell.taken { cursor: default; }
  .cell.disabled { cursor: not-allowed; }

  /* X and O drawn with SVG-like CSS */
  .cell-symbol {
    font-family: 'Space Mono', monospace;
    font-size: clamp(2.2rem, 7vw, 3rem);
    font-weight: 700;
    line-height: 1;
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }
  .cell-symbol.show {
    opacity: 1;
    transform: scale(1);
  }
  .cell-symbol.X { color: var(--x-color); }
  .cell-symbol.O { color: var(--o-color); }

  .cell.win-cell {
    background: #1f1c0a;
  }
  .cell.win-cell .cell-symbol {
    color: var(--win-line);
  }

  /* Ghost preview on hover */
  .cell:not(.taken):not(.disabled):hover .cell-symbol.ghost {
    opacity: 0.18;
    transform: scale(1);
  }

  /* Connection overlay */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(15,15,19,0.88);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    backdrop-filter: blur(2px);
    transition: opacity 0.3s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  #overlay-text {
    font-size: 0.95rem;
    color: var(--muted);
    text-align: center;
    max-width: 200px;
    line-height: 1.5;
  }

  .spinner {
    width: 28px; height: 28px;
    border: 2.5px solid var(--border);
    border-top-color: var(--o-color);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: var(--muted); }
  }

  /* Rematch button */
  #rematch-btn {
    display: none;
    background: transparent;
    border: 2px solid var(--border);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 10px 28px;
    border-radius: 40px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: border-color 0.2s, color 0.2s, transform 0.1s;
  }
  #rematch-btn:hover {
    border-color: var(--text);
    transform: translateY(-1px);
  }
  #rematch-btn.visible { display: block; }

  /* Score */
  #score {
    display: flex;
    gap: 32px;
    font-family: 'Space Mono', monospace;
  }
  .score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .score-label {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .score-label.x { color: var(--x-color); }
  .score-label.o { color: var(--o-color); }
  .score-num {
    font-size: 1.8rem;
    color: var(--text);
    line-height: 1;
    transition: transform 0.2s;
  }
  .score-num.bump {
    animation: bump 0.3s ease;
  }
  @keyframes bump {
    0% { transform: scale(1); }
    50% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }

  /* Connection info */
  #conn-info {
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #conn-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  #conn-dot.connected { background: #3db87a; }
  #conn-dot.error { background: var(--x-color); }
</style>
</head>
<body>

<h1>ta<span class="x">te</span><span class="o">ti</span></h1>

<div id="status-bar">
  <div id="status-dot"></div>
  <span id="status-text">Conectando al servidor...</span>
  <span id="my-symbol"></span>
</div>

<div id="board-wrap">
  <div id="board">
    <div class="cell disabled" data-cell="0"><span class="cell-symbol"></span></div>
    <div class="cell disabled" data-cell="1"><span class="cell-symbol"></span></div>
    <div class="cell disabled" data-cell="2"><span class="cell-symbol"></span></div>
    <div class="cell disabled" data-cell="3"><span class="cell-symbol"></span></div>
    <div class="cell disabled" data-cell="4"><span class="cell-symbol"></span></div>
    <div class="cell disabled" data-cell="5"><span class="cell-symbol"></span></div>
    <div class="cell disabled" data-cell="6"><span class="cell-symbol"></span></div>
    <div class="cell disabled" data-cell="7"><span class="cell-symbol"></span></div>
    <div class="cell disabled" data-cell="8"><span class="cell-symbol"></span></div>
  </div>

  <div id="overlay">
    <div class="spinner"></div>
    <p id="overlay-text">Esperando conexión...</p>
  </div>
</div>

<button id="rematch-btn">Revancha</button>

<div id="score">
  <div class="score-item">
    <span class="score-label x">X</span>
    <span class="score-num" id="score-x">0</span>
  </div>
  <div class="score-item">
    <span class="score-label" style="color:var(--muted)">Empate</span>
    <span class="score-num" id="score-tie">0</span>
  </div>
  <div class="score-item">
    <span class="score-label o">O</span>
    <span class="score-num" id="score-o">0</span>
  </div>
</div>

<div id="conn-info">
  <div id="conn-dot"></div>
  <span id="conn-text">desconectado</span>
</div>

<script src="config.js"></script>

<script>
  
  /*Parte JScript*/
  const WS_URL = `ws://${CONFIG.SERVER_IP}:${CONFIG.WS_PORT}`
  //const WS_URL = 'ws://localhost:8080';

  const cells      = document.querySelectorAll('.cell');
  const overlay    = document.getElementById('overlay');
  const overlayTxt = document.getElementById('overlay-text');
  const statusDot  = document.getElementById('status-dot');
  const statusTxt  = document.getElementById('status-text');
  const mySymbolEl = document.getElementById('my-symbol');
  const rematchBtn = document.getElementById('rematch-btn');
  const scoreX     = document.getElementById('score-x');
  const scoreO     = document.getElementById('score-o');
  const scoreTie   = document.getElementById('score-tie');
  const connDot    = document.getElementById('conn-dot');
  const connTxt    = document.getElementById('conn-text');

  let ws       = null; //la conexión WebSocket
  let miSimbolo = null; //'X' / 'O'
  let miTurno   = false; // Si es mi turno o no
  let juegoTerminado = false; //si el juego terminó
  let puntaje    = { X: 0, O: 0, empate: 0 }; //Puntaje inicial (aparece abajo del tablero)

  
 //Manejo de conexiones:
  function conectar() {
    //Crea la conexión WS con el servidor (esta en puerto 8080)
    estadoConexion('connecting');
    ws = new WebSocket(WS_URL);
    //Una vez se establece conexión, solicita unirse a una sala de juego. 
    ws.onopen = () => {
      estadoConexion('connected');
      enviar({ type: 'unirse_a_sala' });
    };
    //queda esperando por mensajes desde el servidor, que su respuesta en web va a ser manejado por el controladorMensajes
    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      controladorMensajes(msg);
    };

    //evento que ocurrirá cuando la conexión se cierre
    ws.onclose = () => {
      estadoConexion('disconnected');
      mostrar('Conexión perdida. Recargá para reconectar.');
      setEstado('', 'Desconectado');
      deshabilitarTodasLasCeldas();
      reiniciarPuntaje();
    };

    //evento que ocurrirá cuando haya algún error de comunicación
    ws.onerror = () => {
      estadoConexion('error');
    };
  }

  function enviar(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(obj));
    }
  }

  function controladorMensajes(msg) {
    //determina según el tipo de mensaje si:
    switch (msg.type) {
      //muestra que está esperando oponentes
      case 'esperando':
        miSimbolo = msg.symbol;
        verSimboloJugador();
        mostrar('Esperando al otro jugador...');
        setEstado('', 'En sala — esperando oponente');
        break;

      //en caso de que se produzcan nuevas conexiones (luego de empezar una partida) 
      case 'sala_llena':
        mostrar('La sala está llena. Refrescá la página una vez termine para asignarte en la partida.')
        break;
      //habilita las celdas para jugar, saca los otros mensajes de espera, determina el turno inicial.
      case 'empezar':
        miSimbolo = msg.symbol;        // ← asignar ANTES de calcular myTurn
        verSimboloJugador();
        ocultar();
        renderizarTablero(msg.board);
        miTurno   = msg.turn === miSimbolo;
        juegoTerminado = false;
        rematchBtn.classList.remove('visible');
        verTurno(msg.turn);
        habilitarCeldas(msg.board);
        break;
      //actualiza el tablero luego de cada jugada
      case 'estado':
        renderizarTablero(msg.board);
        miTurno   = msg.turn === miSimbolo;
        juegoTerminado = false;
        verTurno(msg.turn);
        habilitarCeldas(msg.board);
        break;
      //fin del juego, deshabilita celdas, determina quien ganó / perdió, muestra botón de revancha
      case 'fin_juego':
        renderizarTablero(msg.board);
        juegoTerminado = true;
        miTurno   = false;
        deshabilitarTodasLasCeldas();
        if (msg.winner) {
          recibirGanador(msg.line);
          const isMe = msg.winner === miSimbolo;
          setEstado('win', isMe ? 'Ganaste!' : 'Perdiste...');
          actualizarPuntaje(msg.winner);
        } else {
          setEstado('', 'Empate');
          actualizarPuntaje(null);
        }
        setTimeout(() => rematchBtn.classList.add('visible'), 600);
        break;
      //muestra errores  
      case 'error':
        flashError(msg.msg);
        break;
      //muestra texto avisando que el rival se fue, y que se está esperando nuevo jugador  
      case 'oponente_desconectado':
        mostrar('El oponente se fue.\nEsperando nuevo jugador...');
        setEstado('', 'Oponente desconectado');
        deshabilitarTodasLasCeldas();
        reiniciarPuntaje();
        break;
    }
  }

  // ---- Renderizado ----

  function renderizarTablero(tablero) {
    cells.forEach((cell, i) => {
      const sym = tablero[i];
      const span = cell.querySelector('.cell-symbol');

      //añadido
      if (span.classList.contains('ghost')) {
        span.textContent = '';
        span.className = 'cell-symbol';
      }

      if (sym && span.textContent !== sym) {
        span.textContent = sym;
        span.className   = `cell-symbol ${sym}`;
        requestAnimationFrame(() => span.classList.add('show'));
        cell.classList.add('taken');
        cell.classList.remove('disabled');
      } else if (!sym) {
        span.textContent = '';
        span.className   = 'cell-symbol';
        cell.classList.remove('taken', 'win-cell');
      }
    });
  }

  function habilitarCeldas(board) {
    cells.forEach((cell, i) => {
      cell.classList.remove('disabled');
      if (board[i] || !miTurno) {
        cell.classList.add('disabled');
      }
    });
  }

  function deshabilitarTodasLasCeldas() {
    cells.forEach(c => c.classList.add('disabled'));
  }

  function recibirGanador(linea) {
    if (!linea) return;
    linea.forEach(i => cells[i].classList.add('win-cell'));
  }

  // ---- Estado ----

  function verTurno(turno) {
    const isMe = turno === miSimbolo;
    const sym  = turno.toLowerCase();
    setEstado(sym, isMe ? 'Tu turno' : 'Turno del oponente');
  }

  function setEstado(dotClass, text) {
    statusDot.className = dotClass;
    statusTxt.textContent = text;
    statusTxt.className = dotClass ? 'active' : '';
  }

  function verSimboloJugador() {
    if (!miSimbolo) return;
    const cls = miSimbolo.toLowerCase();
    mySymbolEl.textContent = `Jugás con ${miSimbolo}`;
    mySymbolEl.className   = cls;
    mySymbolEl.style.display = 'block';
  }

  function actualizarPuntaje(winner) {
    let el, key;
    if (winner === 'X')     { key = 'X'; el = scoreX; }
    else if (winner === 'O') { key = 'O'; el = scoreO; }
    else                     { key = 'empate'; el = scoreTie; }
    puntaje[key]++;
    el.textContent = puntaje[key];
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  function reiniciarPuntaje() {
      puntaje = { X: 0, O: 0, empate: 0 };
      scoreX.textContent = '0';
      scoreO.textContent = '0';
      scoreTie.textContent = '0';
  }

  function flashError(msg) {
    statusTxt.textContent = msg;
    statusTxt.style.color = 'var(--x-color)';
    setTimeout(() => {
      statusTxt.style.color = '';
      verTurno(miSimbolo);
    }, 1500);
  }

  // ---- Texto gráfico ----

  function mostrar(text) {
    overlayTxt.textContent = text;
    overlay.classList.remove('hidden');
  }

  function ocultar() {
    overlay.classList.add('hidden');
  }

  // ---- Indicador conexión ----

  function estadoConexion(s) {
    connDot.className = s === 'connected' ? 'connected' : s === 'error' ? 'error' : '';
    connTxt.textContent = s === 'connected' ? `conectado a ${WS_URL}` : s === 'connecting' ? 'conectando...' : s === 'error' ? 'error de conexión' : 'desconectado';
  }

  // ---- Interacciones ----

  cells.forEach(cell => {
    cell.addEventListener('click', () => {
      if (cell.classList.contains('disabled') || cell.classList.contains('taken') || juegoTerminado) return;
      const idx = parseInt(cell.dataset.cell);
      enviar({ type: 'mov', cell: idx });
    });

    cell.addEventListener('mouseenter', () => {
      if (cell.classList.contains('taken') || cell.classList.contains('disabled') || !miTurno || juegoTerminado) return;
      const span = cell.querySelector('.cell-symbol');
      if (!span.textContent) {
        span.textContent = miSimbolo;
        span.className   = `cell-symbol ${miSimbolo} ghost`;
      }
    });

    cell.addEventListener('mouseleave', () => {
      const span = cell.querySelector('.cell-symbol');
      //Segunda condición agregada
      if (span.classList.contains('ghost') && !cell.classList.contains('taken')) {
        span.textContent = '';
        span.className   = 'cell-symbol';
      }
    });
  });

  rematchBtn.addEventListener('click', () => {
    enviar({ type: 'revancha' });
    rematchBtn.classList.remove('visible');
    setEstado('', 'Esperando revancha...');
  });

  // ---- Inicialización ----

  mostrar('Conectando al servidor...');
  conectar();
</script>
</body>
</html>
